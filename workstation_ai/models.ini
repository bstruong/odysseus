; =============================================================================
; workstation_ai / models.ini
; 
; Principal Architecture: 100% VRAM Presets for AMD Radeon RX 7600 (8GB VRAM)
; Host CPU: Intel Haswell Core i7-4790K (4c/8t, AVX2) + 32GB DDR3 RAM
;
; CRITICAL ARCHITECTURAL RULE: ZERO SPILLOVER INTO SYSTEM RAM
;   Haswell DDR3 bandwidth (~20 GB/s) severely throttles decode. All layers,
;   embeddings, output heads, and KV caches must live 100% within the 8GB VRAM.
; =============================================================================

version = 1

; -----------------------------------------------------------------------------
; Global hardware defaults inherited by all presets
; -----------------------------------------------------------------------------
[*]
; Haswell CPU allocation: 4 physical cores minus 1 = 3 threads.
; Leaves 1 physical core + SMT siblings free for OS, GPU driver, and I/O.
threads = 3
threads-batch = 3

; 100% GPU Offload (Zero CPU Layer Execution)
n-gpu-layers = 99
flash-attn = on

; Dynamic Memory Pre-loading & Locking:
; Pre-load weights directly upfront into VRAM to eliminate disk page faults,
; then lock allocations to prevent OS swapping to disk.
no-mmap = true
mlock = true

; High-Throughput Prefill Scaling:
; Scales prefill speed to 800-1,100+ tokens/sec on document RAG ingestion.
batch-size = 2048
ubatch-size = 1024

; Compressed KV Cache Allocation (Turbo Quant / Q4-Q2):
; 4-bit Keys and 2-bit Values compress KV footprint by ~75%, allowing 16k-32k
; context windows within a ~1.0-1.5 GB VRAM budget.
cache-type-k = q4_0
cache-type-v = q2_k

; Prefix Stability & 256-Token Chunk Cache Reuse:
cache-prompt = true
cache-reuse = 256

; Single client execution slot to guarantee 100% VRAM dedication
parallel = 1
kv-unified = false

; Server Hygiene & OpenAI Compatibility
host = 0.0.0.0
port = 8080
jinja = true
metrics = true
slots = true

; Sampling Defaults for General Writing & Reasoning
repeat-penalty = 1.05
min-p = 0.05
top-p = 0.90
temp = 0.70

; -----------------------------------------------------------------------------
; [gemma4-qat-12b]  PRIMARY GENERALIST (QAT: Near-BF16 Quality at Q4 Footprint)
; -----------------------------------------------------------------------------
; Footprint: ~6.2 GB weights + ~1.2 GB KV cache (16k context at q4/q2) = ~7.4 GB
; Fits 100% in RX 7600 8GB VRAM with 600MB headroom for Vulkan runtime buffers.
[gemma4-qat-12b]
model = /mnt/data/models/gemma-4-12b-it-qat-q4_0.gguf
alias = gemma4-qat-12b,gemma-4-12b,default
ctx-size = 16384
n-gpu-layers = 99
spec-type = draft-mtp
spec-draft-n-max = 3

; -----------------------------------------------------------------------------
; [gemma4-12b]  STANDARD 12B GENERALIST (Deep Comprehension / RAG Synthesis)
; -----------------------------------------------------------------------------
; Footprint: ~7.2 GB weights + ~0.6 GB KV cache (8k context at q4/q2) = ~7.8 GB
; Max density model for complex document RAG synthesis and analysis.
[gemma4-12b]
model = /mnt/data/models/gemma-4-12b-it-q4_k_m.gguf
alias = gemma4-12b
ctx-size = 8192
n-gpu-layers = 99

; -----------------------------------------------------------------------------
; [qwen25-7b]  EXTENDED CONTEXT DAILY DRIVER (32k+ Long-Document Workflows)
; -----------------------------------------------------------------------------
; Footprint: ~4.7 GB weights + ~1.8 GB KV cache (32k context at q4/q2) = ~6.5 GB
; Generous VRAM headroom allows massive context windows for full-document ingestion.
[qwen25-7b]
model = /mnt/data/models/qwen2.5-7b-instruct-q4_k_m.gguf
alias = qwen25-7b,qwen-7b
ctx-size = 32768
n-gpu-layers = 99

; -----------------------------------------------------------------------------
; [llama31-8b]  CONVERSATIONAL PROSE & EMAIL SPECIALIST
; -----------------------------------------------------------------------------
; Footprint: ~4.9 GB weights + ~1.8 GB KV cache (32k context at q4/q2) = ~6.7 GB
; Best-in-class natural tone for drafting correspondence and summaries.
[llama31-8b]
model = /mnt/data/models/llama-3.1-8b-instruct-q4_k_m.gguf
alias = llama31-8b,llama-8b
ctx-size = 32768
n-gpu-layers = 99

; -----------------------------------------------------------------------------
; [gemma4-e4b-vision]  PRIMARY MULTIMODAL & VISION OCR SPECIALIST
; -----------------------------------------------------------------------------
; Footprint: ~5.0 GB weights + ~0.8 GB vision projector + ~1.2 GB KV cache = ~7.0 GB
; Native multimodal processing for OCR, PDF scans, diagrams, and image inspection.
[gemma4-e4b-vision]
model = /mnt/data/models/gemma-4-e4b-it-q4_k_m.gguf
mmproj = /mnt/data/models/gemma-4-e4b-mmproj-f16.gguf
alias = gemma4-e4b-vision,vision-default
ctx-size = 16384
n-gpu-layers = 99
image-max-tokens = 1024

; -----------------------------------------------------------------------------
; [gemma4-e2b-vision]  LIGHTWEIGHT RAPID OCR & CHART EXTRACTOR
; -----------------------------------------------------------------------------
; Footprint: ~2.5 GB weights + ~0.5 GB vision projector = ~3.0 GB VRAM
; Ultra-fast batch image and document processing (~70-90 tokens/sec).
[gemma4-e2b-vision]
model = /mnt/data/models/gemma-4-e2b-it-q4_k_m.gguf
mmproj = /mnt/data/models/gemma-4-e2b-mmproj-f16.gguf
alias = gemma4-e2b-vision,vision-fast
ctx-size = 8192
n-gpu-layers = 99
image-max-tokens = 1024

; -----------------------------------------------------------------------------
; [qwen3-embed]  LOCAL VECTOR EMBEDDING (Document Chunk Indexing for LanceDB)
; -----------------------------------------------------------------------------
; Footprint: ~0.8 GB VRAM. Lightning-fast batch embedding generation for RAG.
[qwen3-embed]
model = /mnt/data/models/qwen3-embedding-q8_0.gguf
alias = qwen3-embed,text-embedding-3-small,embedding-default
embedding = true
ctx-size = 8192
n-gpu-layers = 99
